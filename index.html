<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>店頭QRコードスキャナー</title>

  <!-- LINE Front-end Framework SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
      color: #15213a;
      background: #f5f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding:
        calc(24px + env(safe-area-inset-top))
        20px
        calc(24px + env(safe-area-inset-bottom));
      background: #f5f7fb;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 24px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f9ef;
      font-size: 36px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 26px;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 28px;
      color: #5f6879;
      font-size: 15px;
      line-height: 1.8;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    button:disabled {
      background: #aeb5bf;
      cursor: not-allowed;
      opacity: 0.9;
    }

    #status {
      min-height: 24px;
      margin: 20px 0 0;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .success {
      color: #087a37;
    }

    .error {
      color: #d93025;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      background: #f7f8fa;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .retry-button {
      margin-top: 14px;
      background: #15213a;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon" aria-hidden="true">📷</div>

    <h1>店頭QRコードを読み取る</h1>

    <p class="description">
      下のボタンを押して、店頭に設置されている<br>
      エルメのQRコードを読み取ってください。
    </p>

    <button id="scanButton" type="button" disabled>
      準備中です
    </button>

    <p id="status" aria-live="polite"></p>

    <div id="resultBox" class="result" hidden></div>

    <button
      id="retryButton"
      class="retry-button"
      type="button"
      hidden
    >
      もう一度読み取る
    </button>
  </main>

  <script>
    "use strict";

    const LIFF_ID = "2010959622-FjMnmXLN";

    const scanButton = document.getElementById("scanButton");
    const retryButton = document.getElementById("retryButton");
    const statusElement = document.getElementById("status");
    const resultBox = document.getElementById("resultBox");

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = type;
    }

    function showResult(value) {
      resultBox.hidden = false;
      resultBox.textContent = `読み取り結果：${value}`;
      retryButton.hidden = false;
    }

    function clearResult() {
      resultBox.hidden = true;
      resultBox.textContent = "";
      retryButton.hidden = true;
    }

    function isHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }

    async function initializeLiff() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        if (!liff.isApiAvailable("scanCodeV2")) {
          scanButton.disabled = true;
          scanButton.textContent = "この環境では利用できません";

          setStatus(
            "LINEアプリ内から開き、LINE DevelopersのLIFF設定で「Scan QR」がON、サイズが「Full」になっているか確認してください。",
            "error"
          );

          return;
        }

        scanButton.disabled = false;
        scanButton.textContent = "QRコードを読み取る";

        setStatus(
          "準備ができました。ボタンを押してください。",
          "success"
        );
      } catch (error) {
        console.error("LIFF初期化エラー：", error);

        const errorMessage =
          error?.message || "原因不明のエラーが発生しました。";

        scanButton.disabled = true;
        scanButton.textContent = "初期化に失敗しました";

        setStatus(
          `LIFFの初期化に失敗しました：${errorMessage}`,
          "error"
        );
      }
    }

    async function scanQrCode() {
      scanButton.disabled = true;
      clearResult();
      setStatus("QRコードリーダーを起動しています。");

      try {
        const result = await liff.scanCodeV2();
        const scannedValue = result?.value?.trim();

        if (!scannedValue) {
          throw new Error("QRコードの内容を取得できませんでした。");
        }

        showResult(scannedValue);

        if (isHttpUrl(scannedValue)) {
          setStatus(
            "読み取りに成功しました。ページを開いています。",
            "success"
          );

          setTimeout(() => {
            window.location.assign(scannedValue);
          }, 600);

          return;
        }

        setStatus(
          "QRコードを読み取りましたが、URL形式ではありませんでした。",
          "success"
        );
      } catch (error) {
        console.error("QR読取エラー：", error);

        const errorCode = String(error?.code || "").toUpperCase();
        const errorMessage = String(error?.message || "");

        if (
          errorCode === "CANCEL" ||
          errorMessage.toLowerCase().includes("cancel")
        ) {
          setStatus("読み取りをキャンセルしました。");
        } else {
          setStatus(
            `QRコードを読み取れませんでした：${
              errorMessage || "もう一度お試しください。"
            }`,
            "error"
          );
        }
      } finally {
        scanButton.disabled = false;
      }
    }

    scanButton.addEventListener("click", scanQrCode);
    retryButton.addEventListener("click", scanQrCode);

    initializeLiff();
  </script>
</body>
</html>
